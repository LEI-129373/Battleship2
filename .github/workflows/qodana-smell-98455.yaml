name: Qodana God Class 98455

on:
  pull_request:
  workflow_dispatch:

jobs:
  qodana-god-class:
    name: Qodana God Class 98455
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Qodana with my configuration
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-98455.yaml