# 123282 - Cíntia Brandão
name: Qodana smell gate 123282

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    name: Qodana smell gate 123282
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-12345.yaml
          use-annotations: true
          post-pr-comment: true