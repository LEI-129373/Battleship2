# 129373 - Long Method
name: Qodana Long Method 129373

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    name: Qodana Long Method 129373
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129373.yaml
          results-dir: ${{ github.workspace }}/qodana-results
          use-annotations: true
          post-pr-comment: false
          upload-result: true

      - name: Check Long Method Quality Gate
        if: always()
        run: |
          SARIF_FILE="${{ github.workspace }}/qodana-results/qodana.sarif.json"

          if [ ! -f "$SARIF_FILE" ]; then
            echo "Erro: Ficheiro SARIF não encontrado em $SARIF_FILE"
            exit 1
          fi

          # Conta EXCLUSIVAMENTE os Long Methods (>30 instruções)
          COUNT=$(jq '[.runs[].results[]? | select(.ruleId=="NonCommentSourceStatements")] | length' "$SARIF_FILE")

          echo "=================================================="
          echo "Deteções do Code Smell Long Method: $COUNT"
          echo "=================================================="

          if [ "$COUNT" -gt 0 ]; then
            echo "QUALITY GATE FAILED: Foram encontrados $COUNT métodos com mais de 30 instruções."
            exit 1
          else
            echo "QUALITY GATE PASSED: Nenhum Long Method detetado."
            exit 0
          fi