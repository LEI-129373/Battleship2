# 129373 - Long Method
name: Qodana Long Method 129373

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    name: Qodana Long Method 129373
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129373.yaml
          use-annotations: true
          post-pr-comment: false
          upload-result: true

      - name: Check Long Method Quality Gate
        if: always()
        run: |
          SARIF_FILE=$(find . -name "qodana.sarif.json" | head -n 1)

          if [ -z "$SARIF_FILE" ] || [ ! -f "$SARIF_FILE" ]; then
            echo "Ficheiro SARIF não encontrado."
            exit 1
          fi

          # Filtra unicamente as violações de NonCommentSourceStatements (>30 instruções)
          COUNT=$(jq '[.runs[].results[]? | select(.ruleId=="NonCommentSourceStatements")] | length' "$SARIF_FILE")

          echo "=================================================="
          echo "Deteções de Long Method (NonCommentSourceStatements): $COUNT"
          echo "=================================================="

          if [ "$COUNT" -gt 0 ]; then
            echo "QUALITY GATE FAILED: Detetados $COUNT métodos com mais de 30 instruções."
            exit 1
          else
            echo "QUALITY GATE PASSED: Nenhum Long Method detetado."
            exit 0
          fi