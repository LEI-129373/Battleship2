# 129373 - Long Method
name: Qodana Long Method 129373

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    name: Qodana Long Method 129373
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129373.yaml
          use-annotations: true
          post-pr-comment: true
          upload-result: true
          continue-on-error: true

      - name: Verify Long Method Quality Gate (129373)
        run: |
          SARIF_FILE="../qodana-report/results/qodana.sarif.json"
          if [ -f "$SARIF_FILE" ]; then
            LONG_METHODS=$(jq '[.runs[].results[]? | select(.ruleId=="NonCommentSourceStatements")] | length' $SARIF_FILE)
            echo "Número de Long Methods detetados: $LONG_METHODS"
            if [ "$LONG_METHODS" -gt 0 ]; then
              echo "::error::Quality Gate Falhou! Foram detetados $LONG_METHODS métodos com mais de 30 instruções."
              exit 1
            fi
          else
            echo "Ficheiro SARIF não encontrado em $SARIF_FILE"
            exit 1
          fi