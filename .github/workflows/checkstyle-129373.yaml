# 129373 - Checkstyle MethodName
name: Checkstyle MethodName 129373

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkstyle:
    name: Checkstyle MethodName 129373
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@v1.20.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129373.xml
          level: error
          fail_on_error: true